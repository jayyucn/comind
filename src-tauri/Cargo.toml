[package]
name = "comind"
version = "0.1.0"
edition = "2021"

[lib]
name = "comind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0", features = ["default"] }
comind-core = { path = "../crates/comind-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
regex = "1"
log = "0.4"
simple_logger = "4"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.22", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
url = "2.5"
urlencoding = "2.1"
futures-util = "0.3"
qrcode = "0.14"
image = "0.25"
base64 = "0.22"
# 网页链接块的元数据抓取（ADR-0065 D3）：前端被 CSP connect-src 与 CORS 双重拦死，
# 只能由 Rust 侧发请求。rustls 复用 tokio-tungstenite 已在树上的 TLS 实现，
# charset 用于按 Content-Type 解非 UTF-8 站点（中文站点大量 GBK）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "charset"] }
# 直接解码：响应头常缺 charset，得靠 <meta charset> 嗅探后自己解（含 gb2312→GBK 归一）
encoding_rs = "0.8"
# Dev-only AI debug bridge (tauri-plugin-mcp)。Cargo 的 target cfg 依赖仅识别
# target_os 等 target 属性，不支持 debug_assertions（写在该 section 下不生效，
# release 同样会编译）；故放普通 dependencies，仅 debug 的插件注册与
# manage_window 命令由 lib.rs / commands.rs 的 cfg(debug_assertions) 门控。
# NOTE: git dependency — pin a commit once a stable tag is chosen.
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp" }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# 移动端专用依赖
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
