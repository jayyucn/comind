[package]
name = "comind"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = ["default"] }
comind-core = { path = "../crates/comind-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
regex = "1"
log = "0.4"
simple_logger = "4"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.22", features = ["native-tls"] }
url = "2.5"
get_if_addrs = "0.5"
urlencoding = "2.1"
futures-util = "0.3"
qrcode = "0.14"
image = "0.24"
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
