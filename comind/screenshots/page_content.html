*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.75;
  color: var(--color-ink);
  background: var(--color-paper);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#app {
  height: 100%;
  width: 100%;
}

.tiptap {
  outline: none;
  min-height: 1.3em;
  line-height: 1.25;
}

.tiptap p {
  margin: 0;
  padding: 0;
}

::selection {
  background: var(--color-accent-bg);
  color: var(--color-ink);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

::-webkit-scrollbar {
  width: var(--scrollbar-size);
  height: var(--scrollbar-size);
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--color-scrollbar);
  border-radius: var(--scrollbar-radius);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--text-tertiary);
}

.sortable-ghost,
.sortable-chosen,
.sortable-drag {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
}

.sortable-ghost::before,
.sortable-ghost::after,
.sortable-chosen::before,
.sortable-chosen::after,
.sortable-drag::before,
.sortable-drag::after {
  display: none !important;
}

[draggable=true] {
  -webkit-user-drag: element;
}

.block-children > div:not([data-block-id]):not([data-parent-id]):not(.block-list-padding),
.block-list > div:not([data-block-id]):not([data-parent-id]):not(.block-list-padding) {
  display: none !important;
}

a {
  color: var(--link);
  text-decoration: none;
  transition: all var(--transition-base);
}
a:hover {
  color: var(--link-hover);
  text-decoration: underline;
}

button {

  font-size: inherit;
  cursor: pointer;

  background: none;
}

input,
textarea {
  font-family: inherit;
  font-size: inherit;
}

img {
  max-width: 100%;
  height: auto;
}

ul, ol {
  list-style: none;
}

user-select-none,
.no-select {
  user-select: none;
}

.block-list > div[data-parent-id] {
  width: 100%;
}

.block {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  user-select: none;
}

.block-row {
  display: flex;
  align-items: center;
  min-height: 1.3em;
  line-height: 1.25;
}

.block-indent {
  flex-shrink: 0;
  height: 100%;
}

.block-children::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: calc(var(--indent-depth, 0) * var(--block-indent-width) + 9px);
  width: 1px;
  background: var(--block-bullet-color);
  opacity: 0.12;
  pointer-events: none;
  z-index: 0;
  transition: opacity 200ms ease-out;
}

.block-children:not(.has-children)::before {
  opacity: 0;
}

.block-bullet {
  flex-shrink: 0;
  width: 20px;
  height: 1.8em;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  cursor: pointer;
}

.bullet-dot {
  width: var(--block-bullet-size);
  height: var(--block-bullet-size);
  border-radius: 50%;
  background: var(--block-bullet-color);
  opacity: var(--block-bullet-opacity);
  transform: translateY(1px);
  transition: opacity 150ms ease-out, transform 150ms ease-out, box-shadow 150ms ease-out;
  flex-shrink: 0;
}

.bullet-chevron {
  width: var(--block-chevron-size);
  height: var(--block-chevron-size);
  border-right: 1.5px solid var(--block-bullet-color);
  border-bottom: 1.5px solid var(--block-bullet-color);
  transform: rotate(45deg) translateY(1px);
  opacity: var(--block-chevron-opacity);
  transition: transform 180ms ease-out, opacity 150ms ease-out;
  flex-shrink: 0;
}
.bullet-chevron.is-collapsed {
  transform: rotate(-45deg) translateY(1px);
}

.block-bullet:hover .bullet-dot {
  opacity: 0.7;
  transform: scale(1.4) translateY(1px);
  box-shadow: 0 0 0 3px var(--accent-08);
}
.block-bullet:hover .bullet-chevron {
  opacity: 0.75;
  transform: rotate(45deg) scale(1.2) translateY(1px);
  box-shadow: 0 0 0 3px var(--accent-06);
}
.block-bullet:hover .bullet-chevron.is-collapsed {
  transform: rotate(-45deg) scale(1.2) translateY(1px);
}

.block.active .bullet-dot {
  opacity: 0.55;
}
.block.active .bullet-chevron {
  opacity: 0.6;
}

.block-content {
  flex: 1;
  cursor: text;
  min-width: 0;
}

.block-text {
  min-height: 1.3em;
  padding: 0 4px;
  border-radius: 6px;
  white-space: pre-wrap;
  word-break: break-word;
}

.block-placeholder {
  color: var(--color-ink-faint);
  font-style: italic;
  pointer-events: none;
}

.block.active .block-text {
  background: var(--accent-06);
}

.block-children {
  position: relative;
  padding-left: 20px;
  padding-top: 2px;
  overflow: hidden;
  max-height: 2000px;
  opacity: 1;
  transform: translateY(0);
  min-height: 0;
  transition: max-height var(--block-transition-collapse), opacity 200ms ease-out, transform 250ms ease-out;
}
.block-children.is-collapsed {
  max-height: 0;
  opacity: 0.6;
  transform: translateY(-8px);
}
.block-children.is-animating {
  overflow: hidden;
}

.block-children > .block {
  opacity: 1;
  transform: translateX(0);
  margin-top: 2px;
  transition: opacity 200ms ease-out, transform 200ms ease-out;
}
.block-children.is-collapsed > .block-children > .block {
  opacity: 0;
  transform: translateX(-8px);
}

.block-link {
  color: var(--color-accent);
  cursor: pointer;
  border-bottom: 1px solid var(--accent-40);
}
.block-link.external {
  color: var(--color-external);
  border-bottom-color: var(--ext-40);
}

.block-tag {
  color: var(--color-tag);

  padding: 0 2px;
  border-radius: var(--radius-sm);
  font-size: 0.9em;
}

}

.rel-type-label {
  color: var(--rel-color, currentColor);

  font-style: italic;

  padding: 0 4px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  user-select: none;
}
.rel-type-label .rel-page-title {

  font-style: normal;
  margin-left: 2px;
}
.rel-type-label:hover {
  background: color-mix(in srgb, var(--rel-color) 12%, transparent);
}

@supports not (background: color-mix(in srgb, red 10%, transparent)) {
  .rel-type-label:hover {
    background: rgba(0, 0, 0, 0.05);
  }
}
.block-chosen {
  opacity: 0.8;
}

.block-inner {
  display: flex;
  align-items: center;
  flex: 1;
}

.block-chosen .block-inner {
  background: var(--accent-04);
  border-radius: var(--radius-md);
}

.block-chosen::before,
.block-chosen .block-children::before {
  opacity: 0.3 !important;
}

.block-ghost {
  opacity: 0.3;
  background: var(--accent-06);
  border: 2px dashed var(--color-accent);
  border-radius: var(--radius-md);
  position: relative !important;
  max-width: 100%;
  box-sizing: border-box;
}
.block-ghost .block-content,
.block-ghost .block-bullet {
  visibility: hidden;
}
.block-ghost::after {
  content: "";
  display: block;
  height: 24px;
}
.block-ghost::before {
  display: none !important;
}
.block-ghost .block-children::before {
  display: none !important;
}

.block-drag {
  opacity: 1;
  transform: scale(1.02);
  box-shadow: 0 6px 20px var(--overlay);
  border-radius: var(--radius-md);
  cursor: grabbing;
}

.drop-indicator {
  position: fixed;
  height: 2px;
  background: var(--color-accent);
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  transition: opacity 0ms;
}
.drop-indicator.visible {
  opacity: 1;
}
.drop-indicator.nest {
  border-left: 2px solid var(--color-accent);
  background: transparent;
  height: 0;
}

.block.priority-low .block-inner {
  background: linear-gradient(90deg, var(--priority-low-bg) 0%, rgba(148, 163, 184, 0.02) 100%);
  border-radius: 10px;
}

.block.priority-medium .block-inner {
  background: linear-gradient(90deg, var(--priority-medium-bg) 0%, rgba(234, 179, 8, 0.02) 100%);
  border-radius: 10px;
}

.block.priority-high .block-inner {
  background: linear-gradient(90deg, var(--priority-high-bg) 0%, rgba(249, 115, 22, 0.02) 100%);
  border-radius: 10px;
}

.block.priority-urgent .block-inner {
  background: linear-gradient(90deg, var(--priority-urgent-bg) 0%, rgba(239, 68, 68, 0.02) 100%);
  border-radius: 10px;
}

.block.active.priority-low .block-inner,
.block.active.priority-medium .block-inner,
.block.active.priority-high .block-inner,
.block.active.priority-urgent .block-inner {
  filter: brightness(1.02);

.block-properties {
  margin-left: calc(var(--indent-depth, 0) * var(--block-indent-width) + 20px);
  padding-right: 8px;
}

.block.cb-selected::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--selection-bg);
  pointer-events: none;

  z-index: 1;
}

.block[data-type=concept] .concept-block {
  margin: 4px 0;
}

.page-body {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 100%;
  gap: 48px;
  padding-bottom: var(--space-6);
}

.main-content {
  max-width: var(--max-width);
  min-height: 61.8vh;
  width: 100%;
  margin: 0 auto;
  box-sizing: border-box;
  flex: 1;

  display: flex;
  align-items: center;

  text-overflow: ellipsis;
  white-space: nowrap;
}
